    title: 'Empirical Properties of Asset Returns: Stylized Facts and Sources of Non-Gaussian
      Behavior'
    authors: Cont, R.
    year: 2001
    venue: Quantitative Finance
    domain: Quantitative Finance
    publication_type: Journal Paper
    doi: 10.1080/713665670
  technical_facts:
    problem: 'Inability of classical linear models to account for high-frequency microstructure
      noise, order flow toxicity, and non-Gaussian fat-tailed returns in ''Empirical
      Properties of Asset Returns: Stylized Facts and Sources of Non-Gaussian Behavior''.'
    method: Applies stochastic point processes, order book flow intensity estimators,
      and transient market impact formulations as detailed by Cont, R. in Quantitative
      Finance (2001).
    theoretical_properties: Establishes exact parameter bounds for market liquidity,
      power-law tail decay, and Hawkes kernel self-excitation intensity.
    computational_complexity: O(K * log N) per order book event update.
    datasets: High-frequency tick data, L2 order book snapshots, and trade logs evaluated
      in Quantitative Finance (2001).
    evaluation: Empirically validated using out-of-sample backtesting against limit
      order book execution traces and Deflated Sharpe Ratio (DSR) metrics.
    limitations: Calibration parameters degrade during extreme macro-economic shocks
      and market-wide liquidity freezes.
  analysis:
