      Markov Blanket boundary constraints and KL-divergence minimization.
    computational_complexity: O(S * A * H) where S is state space, A is action space,
      and H is horizon length.
    datasets: Simulated partially observable Markov decision process (POMDP) benchmarks
      and active sensing task environments from Neural Computation.
    evaluation: Demonstrated superior epistemic curiosity and faster goal-directed
      convergence compared to standard epsilon-greedy strategies.
    limitations: High computational overhead when scaling state spaces beyond tractable
      variational approximations.
